<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="light dark">
  <script>
    // Pick the language before first paint: ?lang= link, then saved choice, then browser language.
    (function () {
      var l, ok = function (v) { return v === "de" || v === "en"; };
      try { l = new URLSearchParams(location.search).get("lang"); } catch (e) {}
      if (!ok(l)) { try { l = localStorage.getItem("lang"); } catch (e) {} }
      if (!ok(l)) { l = /^de\b/i.test(navigator.language || "") ? "de" : "en"; }
      document.documentElement.lang = l;
      document.documentElement.setAttribute("data-lang", l);
    })();
  </script>
  <link rel="preload" href="{{ '/assets/fonts/figtree-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/fraunces-latin-soft-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/fiddlehead.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{{ '/' | relative_url }}">
        {% include fiddlehead.svg %}
        <span>Fiddlehead Apps</span>
      </a>
      <div class="lang-switch" role="group" aria-label="Sprache / Language">
        <button type="button" data-set-lang="de" aria-pressed="false" title="Deutsch">DE</button>
        <button type="button" data-set-lang="en" aria-pressed="false" title="English">EN</button>
      </div>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <p>
        <a href="mailto:support@fiddlehead.eu">support@fiddlehead.eu</a>
        · <a href="https://github.com/fiddlehead-apps">GitHub</a>
        · <a href="{{ '/impressum/' | relative_url }}"><span lang="de">Impressum</span><span lang="en">Legal notice</span></a>
      </p>
      <p class="muted">
        <span lang="de">Kein Tracking, keine Cookies, keine Werbung.</span>
        <span lang="en">No tracking, no cookies, no ads.</span>
      </p>
    </div>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var buttons = document.querySelectorAll("[data-set-lang]");
      function apply(l) {
        root.lang = l;
        root.setAttribute("data-lang", l);
        buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.setLang === l)); });
      }
      buttons.forEach(function (b) {
        b.addEventListener("click", function () {
          var l = b.dataset.setLang;
          apply(l);
          try { localStorage.setItem("lang", l); } catch (e) {}
          try {
            var url = new URL(location.href);
            if (url.searchParams.has("lang")) { url.searchParams.set("lang", l); history.replaceState(null, "", url); }
          } catch (e) {}
        });
      });
      apply(root.getAttribute("data-lang") || "de");
    })();
  </script>
</body>
</html>
