# Shared app info for the homepage cards and the app pages.
# accent / accent_dark are the AccentColor values from each app's asset catalog.

- slug: sola-tracker
  name_de: Sola Tracker
  name_en: Sola Tracker
  accent: "#D2621A"
  accent_dark: "#FFA25E"
  repo: https://github.com/fiddlehead-apps/app_tracker
  platforms_de: iPhone und Apple Watch
  platforms_en: iPhone and Apple Watch
  tagline_de: Zähl und verfolge, was dir wichtig ist – schnell und ohne Schnickschnack.
  tagline_en: Count and track what matters to you – quick and simple.
  description_de: >-
    Wasser, Kaffee, Schlaf, Sport, Stimmung oder alles andere. Leg eigene Tracker
    mit eigenen Feldern an oder starte mit einer von 21 Vorlagen und trag mit einem
    Tipp ein – auch im Widget und auf der Apple Watch. Kalender-Heatmap und
    Verlaufsdiagramme zeigen, wie es läuft; CSV-Import und -Export inklusive.
  description_en: >-
    Water, coffee, sleep, workouts, mood or anything else. Build your own trackers
    with custom fields or start from one of 21 templates, then log with a single
    tap – also from a widget or your Apple Watch. A calendar heatmap and timeline
    charts show how it's going; CSV import and export included.

- slug: sola-slideshow
  name_de: Sola Diashow
  name_en: Sola Slideshow
  accent: "#2446D8"
  accent_dark: "#8BA3FF"
  repo: https://github.com/fiddlehead-apps/app_slideshow
  platforms_de: iPhone, iPad und Mac
  platforms_en: iPhone, iPad and Mac
  tagline_de: Zeig deine Fotos als ruhige, schöne Diashow.
  tagline_en: Show your photos as a calm, beautiful slideshow.
  description_de: >-
    Spielt alle Bilder eines Ordners – oder ausgewählte Fotos – als ruhige
    Vollbild-Diashow ab. Zeit pro Bild, Zufallsreihenfolge und Überblenden lassen
    sich einstellen; jede Diashow merkt sich ihre Einstellungen und bleibt in
    deiner Liste. Die Bilder verlassen dein Gerät nie.
  description_en: >-
    Plays every image in a folder – or photos you pick – as a calm full-screen
    slideshow. Set the time per image, shuffle and crossfade; each slideshow
    remembers its settings and stays in your list. Your pictures never leave your
    device.

- slug: sola-birthdays
  name_de: Sola Geburtstage
  name_en: Sola Birthdays
  accent: "#D63A5E"
  accent_dark: "#FF8AA3"
  repo: https://github.com/fiddlehead-apps/app_birthdays
  platforms_de: iPhone und iPad
  platforms_en: iPhone and iPad
  tagline_de: Vergiss nie wieder einen Geburtstag.
  tagline_en: Never forget a birthday again.
  description_de: >-
    Holt die Geburtstage aus deinen Kontakten in eine übersichtliche Liste: heute,
    die nächsten 7 Tage, dann nach Monaten. Erinnerungen kommen zum Wunschzeitpunkt,
    Widgets für Home- und Sperrbildschirm zeigen, wer als Nächstes dran ist.
    Geburtstage von Leuten, die nicht in deinen Kontakten stehen, trägst du von Hand
    ein. Die Kontakte verlassen dein Gerät nie.
  description_en: >-
    Gathers the birthdays from your contacts into a clear list: today, the next 7
    days, then by month. Reminders arrive when you want them, and Home and Lock
    Screen widgets show who's next. Add birthdays by hand for people who aren't in
    your contacts. Your contacts never leave your device.
